[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "com-importer"
version = "0.1.0"
description = "Importer utilities for CoM data"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Mythic" }
]
dependencies = []

[project.scripts]
com-importer = "com_importer.main:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pre-commit>=3.8",
  "pytest>=8.0",
  "ruff>=0.6"
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
