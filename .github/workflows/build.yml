name: Build and Release CoM Importer

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v0.1.0
  workflow_dispatch:  # Allow manual triggering

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: 'macOS'
            build-script: 'bash scripts/build_mac.sh'
            output: 'dist/CoM-Importer.app'
            artifact-name: 'CoM-Importer-macOS'
          - os: windows-latest
            target: 'Windows'
            build-script: 'bash scripts/build_windows.sh'
            output: 'dist/com-importer.exe'
            artifact-name: 'CoM-Importer-Windows'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Build application
        run: ${{ matrix.build-script }}

      - name: Verify output
        run: |
          if [ ! -f "${{ matrix.output }}" ] && [ ! -d "${{ matrix.output }}" ]; then
            echo "Build failed: ${{ matrix.output }} not found"
            exit 1
          fi
          echo "Build successful for ${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests and linting
        run: |
          python -m pytest tests/ -v
          python -m ruff check src tests
          python -m mypy src/com_importer --ignore-missing-imports || true
