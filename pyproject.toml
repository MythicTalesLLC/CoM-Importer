[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "com-importer"
version = "0.1.0"
description = "Importer utilities for CoM data"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Mythic" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
